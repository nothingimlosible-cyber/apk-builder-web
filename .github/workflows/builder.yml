name: APK DJ PRO V3 ULIMATE - ANTI NANYA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build APK Auto Yes
        run: |
          npm install -g @bubblewrap/cli
          echo "y" | bubblewrap init --manifest=https://edit-dj.vercel.app/manifest.json
          bubblewrap build --skipSigning
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-PRO-V3-ULIMATE-APK
          path: app-release-unsigned.apk
