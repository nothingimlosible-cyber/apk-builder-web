name: APK DJ PRO V3 - TEMPLATE GOOGLE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Build Pake Template TWA
        run: |
          git clone https://github.com/GoogleChromeLabs/twa-template.git
          cd twa-template
          sed -i 's/com.example.twa/app.djpro.v3.ulimate/g' app/build.gradle
          sed -i 's|https://example.com|https://edit-dj.vercel.app|g' app/src/main/res/values/strings.xml
          sed -i 's/Example App/DJ PRO V3 ULIMATE/g' app/src/main/res/values/strings.xml
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-PRO-V3-ULIMATE-APK
          path: twa-template/app/build/outputs/apk/debug/app-debug.apk
