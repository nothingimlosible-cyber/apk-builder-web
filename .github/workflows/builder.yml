name: APK DJ PRO V3 ULIMATE - SIMPLE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate APK
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap build https://edit-dj.vercel.app --skipSigning
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-PRO-V3-ULIMATE-APK
          path: app-release-unsigned.apk
