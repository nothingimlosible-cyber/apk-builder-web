name: APK DJ PRO V3 ULIMATE - NODE 24 PRIVATE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # ← Ini ngilangin warning
      
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4  # v4 udah support Node 24
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK  
        uses: android-actions/setup-android@v3  # v3 udah support Node 24
        with:
          cmdline-tools-version: 11076708
          
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
        
      - name: Build APK Non-Interactive
        run: |
          bubblewrap init --manifest=https://edit-dj.vercel.app/manifest.json --directory=twa
          cd twa
          bubblewrap build --skipPwaValidation --skipSigning
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-PRO-V3-ULIMATE-PRIVATE
          path: twa/app-release-unsigned.apk
