name: APK DJ PRO V3 - TWA MANUAL
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone TWA Template
        run: git clone https://github.com/GoogleChromeLabs/svgomg-twa.git twa
        
      - name: Ganti Config
        run: |
          cd twa
          sed -i 's/svgomg.firebaseapp.com/edit-dj.vercel.app/g' app/src/main/res/values/strings.xml
          sed -i 's/SVGOMG/DJ PRO V3/g' app/src/main/res/values/strings.xml
          
      - name: Build APK
        run: |
          cd twa
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-PRO-V3-ULIMATE-APK
          path: twa/app/build/outputs/apk/debug/app-debug.apk
