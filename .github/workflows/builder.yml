name: APK Builder Kaka V5 TANPA TANYA
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Tempel Link PWA Kamu'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Install Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 2. Setup Android SDK
        uses: android-actions/setup-android@v3
          
      - name: 3. Install Bubblewrap
        run: npm i -g @bubblewrap/cli
        
      - name: 4. Bikin Config Manual Biar Gak Nanya
        run: |
          mkdir twa
          cat > twa/twa-manifest.json << 'EOF'
          {
            "packageId": "app.djpro.jedagjedug",
            "host": "edit-dj.vercel.app",
            "name": "DJ PRO V3 JEDAG JEDUG",
            "launcherName": "DJ PRO",
            "display": "standalone",
            "themeColor": "#FF0080",
            "backgroundColor": "#0a0a0a",
            "startUrl": "/",
            "iconUrl": "https://edit-dj.vercel.app/icon-512.png",
            "maskableIconUrl": "https://edit-dj.vercel.app/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli"
          }
          EOF
          
      - name: 5. Build APK Langsung
        run: bubblewrap build --skipSigning -d twa
        
      - name: 6. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-PRO-V3-APK
          path: twa/app-release-unsigned.apk
