name: APK Builder DJ PRO V3 ULIMATE
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Tempel Link PWA Kamu'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Install Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 2. Setup Android SDK
        uses: android-actions/setup-android@v3
          
      - name: 3. Install Bubblewrap
        run: npm i -g @bubblewrap/cli
        
      - name: 4. KASIH TAU BUBBLEWRAP LOKASI JDK
        run: |
          mkdir -p ~/.bubblewrap
          echo "jdkPath=/usr/lib/jvm/temurin-17-jdk-amd64" >> ~/.bubblewrap/config.json
          echo "androidSdkPath=/usr/local/lib/android/sdk" >> ~/.bubblewrap/config.json
        
      - name: 5. Bikin Config Manual DJ PRO V3 ULIMATE
        run: |
          mkdir twa
          cat > twa/twa-manifest.json << 'EOF'
          {
            "packageId": "app.djpro.v3.ulimate",
            "host": "edit-dj.vercel.app",
            "name": "DJ PRO V3 ULIMATE",
            "launcherName": "DJ PRO V3",
            "display": "standalone",
            "themeColor": "#FF0080",
            "backgroundColor": "#0a0a0a",
            "startUrl": "/",
            "iconUrl": "https://edit-dj.vercel.app/icon-512.png",
            "maskableIconUrl": "https://edit-dj.vercel.app/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "appVersionName": "3.0.0",
            "appVersionCode": 3
          }
          EOF
          
      - name: 6. Build APK Langsung
        run: bubblewrap build --skipSigning -d twa
        
      - name: 7. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-PRO-V3-ULIMATE-APK
          path: twa/app-release-unsigned.apk
