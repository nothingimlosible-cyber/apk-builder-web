name: APK DJ PRO V3 - KETOK Y OTOMATIS
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK  
        uses: android-actions/setup-android@v3
        
      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli
        
      - name: Build APK + Jawab "n" Otomatis
        run: |
          yes n | bubblewrap init --manifest=https://edit-dj.vercel.app/manifest.json --directory=twa
          cd twa
          bubblewrap build --skipSigning
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-PRO-V3-ULIMATE-APK
          path: twa/app-release-unsigned.apk
