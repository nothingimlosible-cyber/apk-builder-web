name: APK Builder Kaka V3 ANTI GAGAL
on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Tempel Link PWA Kamu'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Install Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: 2. Setup Android SDK
        uses: android-actions/setup-android@v3
          
      - name: 3. Install Bubblewrap
        run: npm i -g @bubblewrap/cli
        
      - name: 4. Auto Answer Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo '{ "jdkPath": "/usr/lib/jvm/temurin-17-jdk-amd64", "androidSdkPath": "/usr/local/lib/android/sdk" }' > ~/.bubblewrap/config.json
        
      - name: 5. Build APK Anti Nanya
        run: |
          bubblewrap init --manifest=${{ github.event.inputs.url }}/manifest.json --skipPwaValidation
          bubblewrap build --skipSigning
          
      - name: 6. Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DJ-PRO-V3-APK
          path: app-release-unsigned.apk
